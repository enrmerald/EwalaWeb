# CI · se ejecuta en cada PR hacia main y en cada push a main.
#
# Reproduce lo que pide CLAUDE.md para dar un cambio por bueno: lint, tipos, build estático y auditoría
# SEO. Las versiones de pnpm y Node NO se declaran aquí: pnpm/setup las lee de package.json
# (packageManager) y .nvmrc, las mismas que usa Netlify. No definir CONTEXT: sin él el build es de
# «producción» y verify:seo audita canonical, hreflang y Open Graph completos.
#
# Seguridad: sin secretos, solo lectura del repositorio, sin pull_request_target y todas las actions
# fijadas por SHA de commit (Dependabot actualiza el SHA y el comentario de versión).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un PR nuevo cancela la ejecución anterior de ese mismo PR; los push a main nunca se cancelan.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  calidad:
    name: calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Instala pnpm y Node (según package.json y .nvmrc) y ejecuta `pnpm install --frozen-lockfile`.
      # Las políticas de pnpm-workspace.yaml (antigüedad mínima, trustPolicy) se aplican aquí también.
      - name: Instalar pnpm, Node y dependencias
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Build estático
        run: pnpm build

      - name: Auditoría SEO
        run: pnpm verify:seo

      # La clave de Resend (re_…) solo debe vivir en las variables de Netlify, nunca en el bundle público.
      - name: Comprobar que out/ no contiene claves de Resend
        run: |
          if grep -rEq '\bre_[A-Za-z0-9]{20,}' out/; then
            echo "::error::Posible clave de Resend dentro de out/ (bundle público)"
            exit 1
          fi

      # El job `redirecciones` prueba exactamente este out/ (no vuelve a compilar). Solo contiene el
      # sitio público; no hay secretos ni .env en él.
      - name: Publicar out/ para el job de redirecciones
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitio-out
          path: out/
          retention-days: 3
          if-no-files-found: error

  # Sirve out/ con las reglas reales de netlify.toml (netlify dev) y comprueba que las URLs de la web
  # antigua siguen respondiendo 301/410 y las nuevas 200. Cubre redirecciones, 404 y funciones.
  redirecciones:
    name: redirecciones
    needs: calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Versión EXACTA de netlify-cli (publicada hace ≥ 7 días). Dependabot NO la actualiza: revisarla
      # a mano cada trimestre o si Netlify avisa de un fallo de seguridad (ver docs/arquitectura.md).
      NETLIFY_CLI_VERSION: "27.14.0"
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Descargar out/ del job calidad
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sitio-out
          path: out/

      # Solo pnpm y Node (para `pnpm dlx` y el script): no hace falta instalar las dependencias del proyecto.
      - name: Instalar pnpm y Node
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false

      # verificar-redirecciones.mjs saca el inventario de URLs antiguas de esta rama (git show).
      # El checkout es superficial, así que se trae solo ese commit.
      - name: Traer la rama backup-web-antigua
        run: git fetch --no-tags --depth=1 origin backup-web-antigua:refs/remotes/origin/backup-web-antigua

      # trust_policy=off SOLO para este comando: pnpm dlx resuelve el árbol de netlify-cli sin lockfile y
      # su política no-downgrade rechaza dependencias transitivas legítimas. minimumReleaseAge (3 días)
      # sigue activa y los scripts de instalación siguen bloqueados (allowBuilds). El job no tiene
      # secretos y solo lee el repositorio.
      - name: Arrancar netlify dev con out/
        run: |
          pnpm_config_trust_policy=off pnpm dlx --package="netlify-cli@${NETLIFY_CLI_VERSION}" \
            netlify dev --dir out --offline > netlify-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8888/es/)" = "200" ]; then
              echo "netlify dev listo"
              exit 0
            fi
            sleep 2
          done
          echo "::error::netlify dev no respondió en 120 s"
          cat netlify-dev.log
          exit 1

      - name: Verificar redirecciones y estados HTTP
        run: node scripts/verificar-redirecciones.mjs http://localhost:8888

      - name: Registro de netlify dev (solo si falla)
        if: failure()
        run: cat netlify-dev.log || true

  simetria-i18n:
    name: simetria-i18n
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin dependencias: basta el Node que trae el runner.
      - name: Comprobar simetría de claves es/en
        run: node scripts/verificar-i18n.mjs

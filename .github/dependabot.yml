# Dependabot · actualizaciones de versión (las de SEGURIDAD se saltan el cooldown por diseño de GitHub).
#
# Defensa de cadena de suministro: `cooldown` hace que Dependabot ignore las versiones publicadas hace
# menos de N días. Es una segunda barrera, además de `minimumReleaseAge` de pnpm-workspace.yaml (3 días).
# Este fichero solo se activa cuando está en la rama por defecto (main).
#
# Los cambios MAJOR no se agrupan: cada uno llega en su propio PR para poder revisarlo aislado.
# Un PR de Dependabot no se fusiona hasta que el CI esté en verde y se haya mirado el deploy preview.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Un dependency que casa con varios grupos entra en el PRIMERO que coincide: los específicos
    # van antes que los genéricos (dev/prod) del final.
    groups:
      next:
        # next y eslint-config-next están fijados a la misma versión y deben moverse juntos.
        patterns:
          - "next"
          - "eslint-config-next"
        update-types: ["minor", "patch"]
      radix:
        patterns:
          - "@radix-ui/*"
        update-types: ["minor", "patch"]
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/postcss"
          - "postcss"
          - "autoprefixer"
          - "tw-animate-css"
        update-types: ["minor", "patch"]
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]
      desarrollo:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      produccion:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # Debe seguir a la versión de Node del proyecto (.nvmrc, engines): se sube a mano.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Fijado a la versión que soporta Next; el salto de major se decide a mano.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Europe/Madrid"
    # Para este ecosistema solo existe default-days (no admite semver-*-days).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

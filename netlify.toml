  force = true

# El sitemap del blog estaba dado de alta en Search Console: se envía al nuevo.
[[redirects]]
  from = "/blog/sitemap.xml"
  to = "/sitemap.xml"
  status = 301
  force = true

# 5) Contenido retirado de forma permanente → 410 Gone (Google lo desindexa antes que
#    un 404). Se sirve public/410.html con el estado 410.
#
#    Resto del blog Hugo: 22 artículos no migrados, slugs históricos (con tildes,
#    "livet--…", "2024-11-22-…"), /blog/tags/*, /blog/categories/*, /blog/page/*,
#    RSS (/blog/index.xml), CMS (/blog/admin/*) e imágenes del tema.
[[redirects]]
  from = "/blog/*"
  to = "/410.html"
  status = 410
  force = true


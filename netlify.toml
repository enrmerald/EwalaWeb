# 4) Blog: los 4 artículos que existen en la web nueva conservan su posicionamiento
#    con un 301 directo (sin saltos intermedios). DEBEN ir antes del comodín /blog/*.
[[redirects]]
  from = "/blog"
  to = "/es/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/posts/cpg-2-convergencia-it-ot"
  to = "/es/blog/cpg-2-convergencia-it-ot/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/posts/dispositivos-iot-y-las-capas-de-la-ciberseguridad"
  to = "/es/blog/dispositivos-iot-y-las-capas-de-la-ciberseguridad/"

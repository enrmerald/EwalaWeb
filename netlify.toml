# 6) PDFs. El sitemap antiguo enlazaba una versión "-00-" de la política de seguridad
#    que nunca existió; se envía a la vigente ("-01-"). La política medioambiental
#    de 2023 se retiró (sustituida por EWA-POL-0002).
[[redirects]]
  from = "/POL-0001-00-SGI POLITICA DE SEGURIDAD DE LA INFORMACION.pdf"
  to = "/POL-0001-01-SGI%20POLITICA%20DE%20SEGURIDAD%20DE%20LA%20INFORMACION.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/PAM-0001-08-Politica_Medioambiental_2023.pdf"
  to = "/410.html"
  status = 410
  force = true

# 7) La URL /404 estaba en el sitemap antiguo: que responda 404 de verdad, no 200
#    (también si se pide el fichero directamente). Es una reescritura, no un bucle.
[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/404.html"
  to = "/404.html"
  status = 404
  force = true

# ── 404 única. SIEMPRE AL FINAL del fichero: Netlify evalúa las reglas de arriba
# abajo y un comodín por encima de una ruta real se la come. Sin `force`, solo actúa
# cuando no existe un fichero real en out/. ─────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

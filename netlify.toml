# Activos y ficheros internos de la web antigua. Ninguna de estas carpetas existe en la
# web nueva (comprobado contra out/: _next, es, en, favicon, recursos, sellos, team,
# capturas-sentry). Si alguna vez se crea una con estos nombres, quitar su regla.
[[redirects]]
  from = "/assets/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/particles/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]

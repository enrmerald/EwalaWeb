<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Página de contenido retirado (HTTP 410). La sirve netlify.toml para URLs de la web antigua
       que ya no existen. No se indexa. -->
  <meta name="robots" content="noindex, follow">
  <title>Contenido no disponible | Ewala</title>
  <meta name="description" content="Este contenido de Ewala IT Services ya no está disponible.">
  <link rel="icon" href="/favicon/favicon.ico">
  <style>
    :root { --verde: #00e58d; --gris: #2f2f2f; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: var(--gris); color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; line-height: 1.6;
    }
    main { max-width: 560px; text-align: center; }
    img { width: 160px; height: auto; margin-bottom: 40px; }
    .codigo { font-family: ui-monospace, "Space Mono", monospace; color: var(--verde); font-size: 14px; letter-spacing: .1em; margin: 0 0 8px; }
    h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.2; margin: 0 0 16px; }
    p { color: rgba(255,255,255,.75); margin: 0 0 32px; }
    nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a { display: inline-block; padding: 12px 24px; border-radius: 12px; font-weight: 600; text-decoration: none; }
    a.primario { background: var(--verde); color: #111; }
    a.secundario { border: 1px solid rgba(255,255,255,.25); color: #fff; }
    a:hover { opacity: .9; }
    a:focus-visible { outline: 2px solid var(--verde); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/logo_ewala_blanco.png" alt="Ewala IT Services" width="160" height="51">
    <p class="codigo">410 · CONTENIDO RETIRADO</p>
    <h1>Este contenido ya no está disponible</h1>
    <p>Hemos renovado nuestra web y esta página se ha retirado de forma permanente. Puedes visitar la página principal o escribirnos si buscabas algo en concreto.</p>
    <nav>
      <a class="primario" href="/es/">Ir a la página principal</a>
      <a class="secundario" href="/es/contacto/">Contactar</a>
    </nav>
  </main>
</body>
</html>
